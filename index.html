<!DOCTYPE html>

<head>
<meta charset="utf-8">

<div class="grid gap-3" id="camposAdd">
<input id="fCodigo" placeholder="Código" class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder:text-slate-500">

<input id="fObservacao" placeholder="Observação" class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder:text-slate-500">
<input id="fTermos" placeholder="Termos de busca" class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder:text-slate-500">

<button class="px-4 py-2 rounded-xl bg-slate-800 text-slate-100">Cancelar</button>

</div></form></dialog>

<script src="dados-iniciais-v3.js?v=6"></script>
<script>
const API_PECAS_URL = "https://script.google.com/macros/s/AKfycbwpSh4hUeWBz4BQPYPYbB2m0N0y01ViJrB219y2THEOVj5qsw90gA6qBFbexJtBs2Rx/exec"
const API_CCM_URL = API_PECAS_URL
const STORAGE_KEY = "avenorte-cache-v4"
const CSV_PECAS = ["lista_busca_google_sheets.csv"]
const el = sel => document.querySelector(sel)
const lista = el('#lista'), q = el('#q'), setor = el('#setor'), statusEl = el('#status')
let abaAtual = 'dados'
let dados = [], dadosFiltrados = []
let itemEditando = null

const texto = valor => String(valor ?? '').trim()
const safe = valor => texto(valor).toLowerCase()
const semAcento = valor => safe(valor).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
const pegar = (obj, ...keys) => {
  for (const key of keys) {
    const valor = texto(obj?.[key])
    if (valor) return valor
  }
  return ''
}

function salvarCache(arr){ localStorage.setItem(STORAGE_KEY + '-' + abaAtual, JSON.stringify(arr)) }
function carregarCache(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY + '-' + abaAtual)||'[]') }catch{ return [] } }

function ehItemCCM(item) {
  return semAcento(pegar(item, 'setor', 'porta')).startsWith('porta ')
}

function filtrarAbaAtual(lista) {
  return lista.filter(item => abaAtual === 'ccm' ? ehItemCCM(item) : !ehItemCCM(item))
}

function normalizarItem(item) {
  const codigo = pegar(item, 'codigo', 'tag')
  const descricao = pegar(item, 'descricao', 'nome')
  const setor = pegar(item, 'setor', 'porta')
  const observacao = pegar(item, 'observacao')
  const ativa = pegar(item, 'ativa')
  const termosBusca = [codigo, descricao, setor, observacao, ativa, pegar(item, 'termos_busca')].join(' ')

  return {
    ...item,
    codigo,
    descricao,
    setor,
    observacao,
    ativa,
    termos_busca: termosBusca
  }
}

function juntarListas(...listas) {
  const mapa = new Map()
  listas.flat().forEach(itemOriginal => {
    const item = normalizarItem(itemOriginal || {})
    const chave = semAcento(pegar(item, 'codigo', 'tag') || `${pegar(item, 'descricao', 'nome')} ${pegar(item, 'setor', 'porta')}`)
    if (!chave) return
    mapa.set(chave, { ...(mapa.get(chave) || {}), ...item })
  })
  return [...mapa.values()].sort((a,b)=>pegar(a, 'codigo', 'tag').localeCompare(pegar(b, 'codigo', 'tag'), 'pt-BR', {numeric:true}))
}

function dadosEmbutidos() {
  return Array.isArray(window.DADOS_INICIAIS)? window.DADOS_INICIAIS : []
}

async function carregarCsvsPecas() {
  const listas = await Promise.all(CSV_PECAS.map(async arquivo => {
    const resposta = await fetch(`${arquivo}?v=6`, {cache:'no-store'})
    if (!resposta.ok) throw new Error(`Nao carregou ${arquivo}`)
    return csvParaItens(await resposta.text())
  }))
  return listas.flat()
}

function csvParaItens(csv) {
  const linhas = separarCsv(csv)
  const cabecalho = (linhas.shift() || []).map(coluna => semAcento(coluna))
  return linhas.map(linha => {
    const item = {}
    cabecalho.forEach((coluna, indice) => item[coluna] = linha[indice] || '')
    return item
  })
}

function separarCsv(csv) {
  const linhas = []
  let linha = [], campo = '', dentroAspas = false
  for (let i = 0; i < csv.length; i++) {
    const char = csv[i], proximo = csv[i + 1]
    if (char === '"' && dentroAspas && proximo === '"') {
      campo += '"'
      i++
    } else if (char === '"') {
      dentroAspas = !dentroAspas
    } else if (char === ',' && !dentroAspas) {
      linha.push(campo)
      campo = ''
    } else if ((char === '\n' || char === '\r') && !dentroAspas) {
      if (char === '\r' && proximo === '\n') i++
      linha.push(campo)
      if (linha.some(valor => texto(valor))) linhas.push(linha)
      linha = []
      campo = ''
    } else {
      campo += char
    }
  }
  linha.push(campo)
  if (linha.some(valor => texto(valor))) linhas.push(linha)
  return linhas
}

async function carregarDados(){
statusEl.textContent = 'Carregando...'
statusEl.className = 'text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-300'
try{
const j = await carregarApi()
if (j && j.ok === false) throw new Error(j.mensagem || j.erro || 'Erro ao carregar planilha.')
const dadosApi = Array.isArray(j)? j : (j.itens || j.data || [])
const listaNova = filtrarAbaAtual(juntarListas(dadosApi))
if (!listaNova.length) throw new Error('A planilha retornou uma lista vazia.')
dados = listaNova
salvarCache(dados)
montarSetores()
aplicarFiltro()
statusEl.textContent = 'Online'
statusEl.className = 'text-xs px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/30'
return true
}catch(e){
console.error(e)
statusEl.textContent = 'Offline'
statusEl.className = 'text-xs px-2 py-1 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/30'
dados = carregarCache()
dados = filtrarAbaAtual(dados)
montarSetores()
aplicarFiltro()
return false
}}

function carregarDadosSalvos(){
statusEl.textContent = 'Dados salvos'
statusEl.className = 'text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-300'
dados = carregarCache()
dados = filtrarAbaAtual(dados)
montarSetores()
aplicarFiltro()
}

function carregarApi() {
  return chamarJsonp(abaAtual === 'dados'? API_PECAS_URL : API_CCM_URL, {acao: 'listar', aba: abaAtual})
}

function salvarItemLocal(obj) {
  dados = filtrarAbaAtual(juntarListas(dados, [obj]))
  salvarCache(dados)
  montarSetores()
  aplicarFiltro()
}

function chamarJsonp(url, params = {}) {
  return new Promise((resolve, reject) => {
    const callback = `avenorte_${Date.now()}_${Math.random().toString(36).slice(2)}`
    const script = document.createElement('script')
    const query = new URLSearchParams({...params, callback, t: Date.now()})
    const timer = setTimeout(() => {
      limpar()
      reject(new Error('Tempo esgotado ao carregar planilha.'))
    }, 15000)

    function limpar() {
      clearTimeout(timer)
      delete window[callback]
      script.remove()
    }

    window[callback] = resposta => {
      limpar()
      resolve(resposta || {itens: []})
    }

    script.onerror = () => {
      limpar()
      reject(new Error('Nao consegui carregar a planilha.'))
    }

    script.src = `${url}?${query.toString()}`
    document.body.appendChild(script)
  })
}

function atualizarLabels() {
  const isCCM = abaAtual === 'ccm'
  el('#labelFiltro').textContent = isCCM? 'Filtrar por porta' : 'Filtrar por setor'
  el('#fCodigo').placeholder = isCCM? 'Tag' : 'Código'
  el('#fDescricao').placeholder = isCCM? 'Nome' : 'Descrição'
  el('#fSetor').placeholder = isCCM? 'Porta' : 'Setor'
  el('#fObservacao').placeholder = isCCM? 'Ativa - SIM ou NÃO' : 'Observação'
  el('#tituloModal').textContent = isCCM? 'Adicionar tag CCM' : 'Adicionar peça'
  q.placeholder = isCCM? 'Tag, nome, porta...' : 'Código, descrição...'
}

function tituloFormulario() {
  const acao = itemEditando? 'Editar' : 'Adicionar'
  const tipo = abaAtual === 'ccm'? 'tag CCM' : 'peça'
  el('#tituloModal').textContent = `${acao} ${tipo}`
  el('#salvarAdd').textContent = itemEditando? 'Salvar alteração' : 'Salvar'
}

function montarSetores(){
const campo = abaAtual === 'ccm'? 'porta' : 'setor'
atualizarLabels()
const setores = [...new Set(dados.map(x=>pegar(x, campo)).filter(Boolean))].sort((a,b)=>a.localeCompare(b, 'pt-BR', {numeric:true}))
setor.innerHTML = '<option value="">Todos</option>' + setores.map(s=>`<option>${escapar(s)}</option>`).join('')
el('#filtroWrap').style.display = setores.length? 'block' : 'none'
}

function aplicarFiltro(){
const termo = semAcento(q.value)
const s = setor.value
const campoSetor = abaAtual === 'ccm'? 'porta' : 'setor'
dadosFiltrados = dados.filter(item=>{
const okSetor = !s || pegar(item, campoSetor) === s
const base = [
  pegar(item, 'codigo', 'tag'),
  pegar(item, 'descricao', 'nome'),
  pegar(item, 'setor', 'porta'),
  pegar(item, 'observacao'),
  pegar(item, 'ativa'),
  pegar(item, 'termos_busca')
].join(' ')
const okBusca = !termo || semAcento(base).includes(termo)
return okSetor && okBusca
})
render()
}

function limparBusca() {
  q.value = ''
  setor.value = ''
  aplicarFiltro()
  q.focus()
}

function render(){
el('#contagem').textContent = dadosFiltrados.length
lista.innerHTML = dadosFiltrados.map((item, indice)=>{
let statusHTML = ''
if (abaAtual === 'ccm') {
  const ativa = pegar(item, 'ativa').toUpperCase()
  if (ativa === 'SIM') statusHTML = '<span class="px-2 py-1 rounded-full bg-sky-500/10 text-sky-300 border border-sky-500/30 text-xs">ATIVA</span>'
  else if (ativa === 'NÃO' || ativa === 'NAO') statusHTML = '<span class="px-2 py-1 rounded-full bg-red-500/10 text-red-300 border border-red-500/30 text-xs">INATIVA</span>'
  else statusHTML = '<span class="px-2 py-1 rounded-full bg-slate-800 text-slate-400 text-xs">A VERIFICAR</span>'
}

const codigo = pegar(item, 'codigo', 'tag') || '-'
const desc = pegar(item, 'descricao', 'nome')
const setorVal = pegar(item, 'setor', 'porta')
const obs = pegar(item, 'observacao')

return `
<div class="p-4 rounded-2xl bg-slate-900 border border-slate-800">
<div class="flex items-start justify-between gap-3">
<div class="flex-1 min-w-0">
<div class="text-lg font-semibold text-slate-100 break-words">${escapar(codigo)} ${statusHTML}</div>
${desc? `<div class="text-slate-300 break-words">${escapar(desc)}</div>` : ''}
${setorVal || (obs && abaAtual !== 'ccm')? `
<div class="mt-2 flex flex-wrap gap-2 text-xs">
${setorVal? `<span class="px-2 py-1 rounded-full bg-slate-800 text-slate-300">${escapar(setorVal)}</span>` : ''}
${obs && abaAtual !== 'ccm'? `<span class="px-2 py-1 rounded-full bg-slate-800 text-slate-300">${escapar(obs)}</span>` : ''}
</div>` : ''}
</div>
<div class="shrink-0 flex flex-col gap-2">
<button type="button" data-editar="${indice}" class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-100 hover:bg-slate-700">Editar</button>
<button type="button" data-excluir="${indice}" class="px-3 py-1.5 rounded-xl bg-transparent border border-red-500/20 text-red-300/70 hover:bg-red-500/10 hover:text-red-200 text-xs">Excluir</button>
</div>
</div></div>
`}).join('') || `<div class="text-center text-slate-500 py-10">Nenhum resultado</div>`

lista.querySelectorAll('[data-editar]').forEach(botao => {
  botao.onclick = () => abrirEditar(dadosFiltrados[Number(botao.dataset.editar)])
})
lista.querySelectorAll('[data-excluir]').forEach(botao => {
  botao.onclick = () => excluirItem(dadosFiltrados[Number(botao.dataset.excluir)])
})
}

function trocarAba(novaAba) {
  abaAtual = novaAba
  el('#abaPecas').className = novaAba === 'dados'?
    'flex-1 px-4 py-2.5 rounded-xl bg-sky-500 text-slate-950 font-semibold' :
    'flex-1 px-4 py-2.5 rounded-xl bg-transparent text-slate-300 hover:bg-slate-800'
  el('#abaCCM').className = novaAba === 'ccm'?
    'flex-1 px-4 py-2.5 rounded-xl bg-sky-500 text-slate-950 font-semibold' :
    'flex-1 px-4 py-2.5 rounded-xl bg-transparent text-slate-300 hover:bg-slate-800'
  q.value = ''
  setor.value = ''
  carregarDadosSalvos()
}

async function adicionarItem(obj){
statusEl.textContent = 'Salvando...'
try{
const res = abaAtual === 'dados'
  ? await chamarJsonp(API_PECAS_URL, {acao: 'cadastrar', aba: abaAtual, ...obj})
  : await chamarJsonp(API_CCM_URL, {acao: 'cadastrar', aba: abaAtual, ...obj})
if(res.ok){
salvarItemLocal(res.item || obj)
const atualizou = await carregarDados()
statusEl.textContent = atualizou ? 'Salvo!' : 'Salvo no aparelho'
setTimeout(()=>statusEl.textContent = atualizou ? 'Online' : 'Dados salvos', 1500)
return true
} else {
statusEl.textContent = 'Erro'
alert('Erro: ' + (res.erro || 'Não foi possível salvar'))
setTimeout(()=>statusEl.textContent = 'Online', 2000)
return false
}
}catch(e){
statusEl.textContent = 'Erro de conexão'
alert('Erro de conexão. Verifique o Apps Script.')
setTimeout(()=>statusEl.textContent = 'Online', 2000)
return false
}
}

function acaoInvalida(res) {
  const msg = `${res?.codigo || ''} ${res?.erro || ''} ${res?.mensagem || ''}`.toLowerCase()
  return msg.includes('acao_invalida') || msg.includes('acao invalida') || msg.includes('ação inválida')
}

async function atualizarItemPorSubstituicao(obj, dadosAtualizados) {
  const url = abaAtual === 'dados'? API_PECAS_URL : API_CCM_URL
  const senha = prompt('Senha para substituir este item')
  if (senha === null) return {ok: false, mensagem: 'Operação cancelada.'}
  if (!/^\d{4}$/.test(senha)) return {ok: false, mensagem: 'A senha precisa ter 4 dígitos.'}
  const apagar = await chamarJsonp(url, {
    acao: 'deletar',
    aba: abaAtual,
    senha,
    linha: dadosAtualizados.linha,
    codigo: dadosAtualizados.codigo_original,
    tag: dadosAtualizados.codigo_original
  })

  if (!apagar.ok && !['nao_encontrado', 'não_encontrado'].includes(apagar.codigo)) {
    return apagar
  }

  return chamarJsonp(url, {acao: 'cadastrar', aba: abaAtual, ...obj})
}

async function excluirItem(item) {
  const codigo = pegar(item, 'codigo', 'tag')
  const senha = prompt(`Senha para excluir "${codigo}"`)
  if (senha === null) return
  if (!/^\d{4}$/.test(senha)) {
    alert('A senha precisa ter 4 dígitos.')
    return
  }

  const confirmar = confirm(`Excluir "${codigo}" da planilha?`)
  if (!confirmar) return

  statusEl.textContent = 'Excluindo...'
  try {
    const url = abaAtual === 'dados'? API_PECAS_URL : API_CCM_URL
    const res = await chamarJsonp(url, {
      acao: 'deletar',
      aba: abaAtual,
      senha,
      linha: pegar(item, 'linha'),
      codigo,
      tag: codigo
    })

    if (res.ok) {
      await carregarDados()
      statusEl.textContent = 'Excluído!'
      setTimeout(()=>statusEl.textContent = 'Online', 1500)
      return
    }

    statusEl.textContent = 'Erro'
    alert('Erro: ' + (res.erro || res.mensagem || 'Não foi possível excluir'))
    setTimeout(()=>statusEl.textContent = 'Online', 2000)
  } catch(e) {
    statusEl.textContent = 'Erro de conexão'
    alert('Erro de conexão. Verifique o Apps Script.')
    setTimeout(()=>statusEl.textContent = 'Online', 2000)
  }
}

async function atualizarItem(obj){
statusEl.textContent = 'Salvando...'
try{
const original = itemEditando || {}
const dadosAtualizados = {
  ...obj,
  linha: pegar(original, 'linha'),
  codigo_original: pegar(original, 'codigo', 'tag')
}
const res = abaAtual === 'dados'
  ? await chamarJsonp(API_PECAS_URL, {acao: 'atualizar', aba: abaAtual, ...dadosAtualizados})
  : await chamarJsonp(API_CCM_URL, {acao: 'atualizar', aba: abaAtual, ...dadosAtualizados})
const finalRes = res.ok || !acaoInvalida(res)? res : await atualizarItemPorSubstituicao(obj, dadosAtualizados)
if(finalRes.ok){
await carregarDados()
statusEl.textContent = 'Alterado!'
setTimeout(()=>statusEl.textContent = 'Online', 1500)
return true
} else {
statusEl.textContent = 'Erro'
alert('Erro: ' + (finalRes.erro || finalRes.mensagem || 'Não foi possível alterar'))
setTimeout(()=>statusEl.textContent = 'Online', 2000)
return false
}
}catch(e){
statusEl.textContent = 'Erro de conexão'
alert('Erro de conexão. Verifique o Apps Script.')
setTimeout(()=>statusEl.textContent = 'Online', 2000)
return false
}
}

function abrirAdicionar() {
  itemEditando = null
  atualizarLabels()
  tituloFormulario()
  el('#modalAdd form').reset()
  el('#modalAdd').showModal()
}

function abrirEditar(item) {
  itemEditando = item
  atualizarLabels()
  tituloFormulario()
  el('#fCodigo').value = pegar(item, 'codigo', 'tag')
  el('#fDescricao').value = pegar(item, 'descricao', 'nome')
  el('#fSetor').value = pegar(item, 'setor', 'porta')
  el('#fObservacao').value = abaAtual === 'ccm'? pegar(item, 'ativa') : pegar(item, 'observacao')
  el('#fTermos').value = pegar(item, 'termos_busca')
  el('#modalAdd').showModal()
}

function escapar(valor) {
  return String(valor ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;')
}

el('#abaPecas').onclick = () => trocarAba('dados')
el('#abaCCM').onclick = () => trocarAba('ccm')
el('#btnBuscar').onclick = aplicarFiltro
el('#btnLimpar').onclick = limparBusca
el('#btnAtualizar').onclick = carregarDados
el('#btnAdicionar').onclick = ()=> {
  abrirAdicionar()
}
el('#salvarAdd').onclick = async (e)=>{
e.preventDefault()
const obj = {
  codigo: el('#fCodigo').value.trim(),
  descricao: el('#fDescricao').value.trim(),
  setor: el('#fSetor').value.trim(),
  observacao: el('#fObservacao').value.trim(),
  termos_busca: el('#fTermos').value.trim()
}
if(abaAtual === 'ccm') {
  obj.tag = obj.codigo
  obj.nome = obj.descricao
  obj.porta = obj.setor
  obj.ativa = obj.observacao
  delete obj.codigo
  delete obj.descricao
  delete obj.setor
  delete obj.observacao
}
const cod = obj.codigo || obj.tag
if(!cod) return alert('Código/Tag obrigatório')
const codigoOriginal = itemEditando? semAcento(pegar(itemEditando, 'codigo', 'tag')) : ''
const existe = dados.find(item => semAcento(pegar(item, 'codigo', 'tag')) === semAcento(cod) && semAcento(pegar(item, 'codigo', 'tag')) !== codigoOriginal)
if(existe) return alert('Código já existe: ' + cod)
const salvou = itemEditando? await atualizarItem(obj) : await adicionarItem(obj)
if(salvou){
el('#modalAdd').close()
el('#modalAdd form').reset()
itemEditando = null
}
}
let debounce
q.oninput = () => {
  clearTimeout(debounce)
  debounce = setTimeout(aplicarFiltro, 200)
}
setor.onchange = aplicarFiltro
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
    .catch(() => {})
}
carregarDadosSalvos()
</script>
</body>
</html>
