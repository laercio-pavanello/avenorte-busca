<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avenorte Busca</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      padding: 20px;
    }
  .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 20px; }
    h1 span { color: #1d9bf0; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .status { display: flex; gap: 10px; align-items: center; }
  .online { background: #00ba7c; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
  .btn-atualizar {
      background: #1d9bf0; border: none; color: white; padding: 8px 16px;
      border-radius: 20px; cursor: pointer; font-weight: 600;
    }

    /* Abas Peças / CCM */
  .abas {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
  .abas button {
      flex: 1;
      padding: 12px;
      border: 1px solid #2f3336;
      background: #16181c;
      color: #e7e9ea;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
    }
  .abas button.ativo {
      background: #1d9bf0;
      border-color: #1d9bf0;
      color: white;
    }

  .filtros { display: flex; gap: 10px; margin-bottom: 15px; }
  .filtros input,.filtros select {
      flex: 1;
      padding: 12px;
      background: #202327;
      border: 1px solid #2f3336;
      border-radius: 8px;
      color: #e7e9ea;
      font-size: 15px;
    }
  .acoes { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .acoes button {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
  .btn-buscar { background: #1d9bf0; color: white; }
  .btn-adicionar { background: #2f3336; color: #e7e9ea; }

  .card {
      background: #16181c;
      border: 1px solid #2f3336;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 12px;
    }
  .card strong { font-size: 17px; color: #e7e9ea; }
  .card p { color: #71767b; margin: 6px 0; }
  .card.tag {
      display: inline-block;
      background: #202327;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      color: #71767b;
      margin-top: 8px;
    }
  .status-ccm {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
  .status-sim { background: #1d9bf0; color: white; }
  .status-nao { background: #f4212e; color: white; }
  .status-vazio { background: #2f3336; color: #71767b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Avenorte <span>Busca</span></h1>
      <div class="status">
        <span class="online">Online</span>
        <button class="btn-atualizar" onclick="carregarDados()">Atualizar</button>
      </div>
    </div>

    <div class="abas">
      <button id="btnPecas" class="ativo" onclick="trocarAba('dados')">Peças</button>
      <button id="btnCCM" onclick="trocarAba('ccm')">CCM</button>
    </div>

    <div class="filtros">
      <input type="text" id="busca" placeholder="Código, descrição, setor..." oninput="buscar()">
      <select id="filtroSetor" onchange="buscar()">
        <option value="">Todos</option>
      </select>
    </div>

    <div class="acoes">
      <span id="contador" style="color:#71767b;"></span>
      <div>
        <button class="btn-buscar" onclick="buscar()">Buscar</button>
        <button class="btn-adicionar">Adicionar</button>
      </div>
    </div>

    <div id="resultados"></div>
  </div>

  <script>
    const URL_API = 'COLE_SUA_URL_DO_APPS_SCRIPT_AQUI';
    let abaAtual = 'dados';
    let dadosCompletos = [];

    async function carregarDados() {
      document.getElementById('resultados').innerHTML = '<p style="text-align:center;color:#71767b;">Carregando...</p>';
      const resposta = await fetch(`${URL_API}?aba=${abaAtual}`);
      dadosCompletos = await resposta.json();
      atualizarFiltroSetor();
      buscar();
    }

    function trocarAba(nomeAba) {
      abaAtual = nomeAba;
      document.getElementById('btnPecas').classList.toggle('ativo', nomeAba === 'dados');
      document.getElementById('btnCCM').classList.toggle('ativo', nomeAba === 'ccm');
      document.getElementById('busca').value = '';
      carregarDados();
    }

    function atualizarFiltroSetor() {
      const select = document.getElementById('filtroSetor');
      const campoSetor = abaAtual === 'ccm'? 'porta' : 'setor';
      const setores = [...new Set(dadosCompletos.map(item => item[campoSetor]).filter(Boolean))];
      select.innerHTML = '<option value="">Todos</option>' +
        setores.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    function buscar() {
      const termo = document.getElementById('busca').value.toLowerCase();
      const setorFiltro = document.getElementById('filtroSetor').value;
      const divResultados = document.getElementById('resultados');
      const campoSetor = abaAtual === 'ccm'? 'porta' : 'setor';

      let filtrados = dadosCompletos.filter(item => {
        const matchTermo = Object.values(item).some(val => String(val).toLowerCase().includes(termo));
        const matchSetor =!setorFiltro || item[campoSetor] === setorFiltro;
        return matchTermo && matchSetor;
      });

      document.getElementById('contador').textContent = `${filtrados.length} resultados`;
      divResultados.innerHTML = '';

      filtrados.slice(0, 100).forEach(item => {
        let statusHTML = '';
        if (abaAtual === 'ccm') {
          const ativa = item.ativa? String(item.ativa).toUpperCase() : '';
          if (ativa === 'SIM') statusHTML = '<span class="status-ccm status-sim">ATIVA</span>';
          else if (ativa === 'NÃO' || ativa === 'NAO') statusHTML = '<span class="status-ccm status-nao">INATIVA</span>';
          else statusHTML = '<span class="status-ccm status-vazio">A VERIFICAR</span>';
        }

        const setorTag = item[campoSetor]? `<div class="tag">${item[campoSetor]}</div>` : '<div class="tag">Sem setor</div>';

        divResultados.innerHTML += `
          <div class="card">
            <strong>${item.tag || item.codigo}</strong> ${statusHTML}
            <p>${item.nome || item.descricao || ''}</p>
            ${setorTag}
          </div>
        `;
      });
    }

    carregarDados();
  </script>
</body>
</html>
